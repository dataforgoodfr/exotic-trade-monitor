[project]
name = "ingestion"
version = "0.1.0"
description = "Data ingestion pipelines for Exotic Trade Monitor"
requires-python = ">=3.12"
dependencies = [
    "chardet<6",
    "click>=8.1.8",
    "pandas>=2.2.3",
    "pyjstat>=2.4.0",
    "requests>=2.32.3",
]

[project.scripts]
ingest = "ingestion.cli:main"

[build-system]
requires = ["uv_build>=0.7.3,<0.14.0"]
build-backend = "uv_build"
