repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    # Ruff version.
    rev: "v0.2.1"
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.0.4
    hooks:
      - id: sqlfluff-lint
      - id: sqlfluff-fix

  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.8
    hooks:
      # Run dbt parse command. Generate manifest.json up-to-date
      - id: dbt-parse
      # Ensures that the model has a properties file
      - id: check-model-has-properties-file
        files: ^dbt_ETM/models/
        args: ["--manifest", "dbt_ETM/target/manifest.json"]
      # Ensures that the model has a description in the properties file
      - id: check-model-has-description
        files: ^dbt_ETM/models/
        args: ["--manifest", "dbt_ETM/target/manifest.json"]
      # Ensures that the model has columns with descriptions in the properties file
      - id: check-model-columns-have-desc
        files: ^dbt_ETM/models/
        args: ["--manifest", "dbt_ETM/target/manifest.json"]
      # Run dbt doc generate command. Generate catalog.json up-to-date used by the next dbt check
      - id: dbt-docs-generate
      # Ensures that all columns in the database are also specified in the properties file.  
      - id: check-model-has-all-columns
        files: ^dbt_ETM/models
        args:
          [
            "--manifest",
            "dbt_ETM/target/manifest.json",
            "--catalog",
            "dbt_ETM/target/catalog.json",
          ]
