repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: "v0.17.6"
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.0.4
    hooks:
      - id: sqlfluff-lint
        args: [--config, .sqlfluff]
        additional_dependencies:
          - dbt-core
          - sqlfluff-templater-dbt
        files: ^dbt_ETM/models/
      - id: sqlfluff-fix
        args: [--config, .sqlfluff]
        additional_dependencies:
          - dbt-core
          - sqlfluff-templater-dbt
        files: ^dbt_ETM/models/

  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.8
    hooks:
      # Run dbt deps.  Pulls the most recent version of the dependencies listed in your packages.yml.
      - id: dbt-deps
        stages: [manual]
      # Run dbt parse command. Generate manifest.json up-to-date
      - id: dbt-parse
        stages: [manual]
      # Ensures that the model has a properties file
      - id: check-model-has-properties-file
        stages: [manual]
        files: ^dbt_ETM/models/
        args: ["--manifest", "dbt_ETM/target/manifest.json"]
      # Ensures that the model has a description in the properties file
      - id: check-model-has-description
        stages: [manual]
        files: ^dbt_ETM/models/
        args: ["--manifest", "dbt_ETM/target/manifest.json"]
      # Ensures that the model has columns with descriptions in the properties file
      - id: check-model-columns-have-desc
        stages: [manual]
        files: ^dbt_ETM/models/
        args: ["--manifest", "dbt_ETM/target/manifest.json"]

      # Ensures that all columns in the database are also specified in the properties file.
      - id: check-model-has-all-columns
        stages: [manual]
        files: ^dbt_ETM/models
        args:
          [
            "--manifest",
            "dbt_ETM/target/manifest.json",
            "--catalog",
            "dbt_ETM/target/catalog.json",
          ]

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.2
    hooks:
      - id: markdownlint-cli2

  # Detect unused Python code
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        args: [--min-confidence, "80"]

  # Python security analysis
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.2
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
