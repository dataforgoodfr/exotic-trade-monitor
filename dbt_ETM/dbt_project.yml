
name: 'dbt_ETM'
version: '1.0.0'

profile: 'dbt_ETM'

model-paths: ["models"]
#analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
#snapshot-paths: ["snapshots"]

clean-targets: 
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:
  dbt_ETM:
    # Config indicated by + and applies to all files under models/example/
    example:
      +materialized: view
    raw:
      +materialized: view
      +schema: raw
      +tag: raw
    intermediate:
      +materialized: view
      +schema: intermediaire
      +tag: intermediaire
    metabase:
      +materialized: table
      +schema: metabase
      +tag: metabase
    website:
      +materialized: table
      +schema: website
      +tag: website
