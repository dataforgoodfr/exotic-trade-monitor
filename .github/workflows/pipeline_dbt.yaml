name: dbt_pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "dbt_ETM/**"
  push:
    branches: [main]
    paths:
      - "dbt_ETM/**"

permissions:
  contents: read

concurrency:
  group: dbt-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dbt:
    name: Validate dbt project structure, download csv inputs and test dbt pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

# TO DO
#     - name: Download pipeline : inputs from clever cloud
#        run: |
#          uv run python download_inputs.py 

      - name: DEBUG - Run dbt parse directly
        run: |
          uv run dbt parse --project-dir dbt_ETM --debug

# TO TEST dbt 
      - name: Run dbt pipeline and test
        run: |
          uv run pre-commit run dbt-parse --hook-stage manual  --all-files 
#          uv run pre-commit run --hook-stage manual  --all-files
##         uv run pre-commit run --hook-stage manual --from-ref origin/main --to-ref HEAD

