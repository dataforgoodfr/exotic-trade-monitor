permissions:
  contents: read

concurrency:
  group: dbt-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dbt:
    name: Validate dbt project structure, download csv inputs and test dbt pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

# TO BE REPLACE : by download_inputs.py 
