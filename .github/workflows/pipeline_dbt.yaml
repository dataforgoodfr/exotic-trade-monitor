#        run: |
#          uv run python xx.py

# TO DO
#      - name: Download pipeline csv inputs from bucket
#        run: |
#          uv run python xx.py 

      - name: Run dbt pipeline and test
        run: |
          uv run pre-commit run --hook-stage manual  --all-files
