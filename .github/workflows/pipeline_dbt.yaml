name: dbt_pipeline

on:
  workflow_dispatch:

jobs:
  validate-dbt:
    name: Validate dbt project structure, download csv inputs and test dbt pipeline
    runs-on: ubuntu-latest
    env:
      CLEVER_TOKEN: ${{ secrets.CLEVER_S3_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_S3_SECRET }}
      CLEVER_REGION: ${{ vars.CLEVER_REGION }}
      CLEVER_ENDPOINT_URL: ${{ vars.CLEVER_ENDPOINT_URL }}
      CLEVER_PCC_BUCKET: ${{ vars.CLEVER_PCC_BUCKET }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and sync uv
        run: |
          pip install uv
          uv sync

# TO DO ?
