[project]
name = "15_exotic_trade_monitor"
version = "0.1.0"
description = "D4G - Saison 15 - Exotic Trade Monitor project - Code Animal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chardet<6",
    "click>=8.1.8",
    "pandas>=2.2.3",
    "pyjstat>=2.4.0",
    "requests>=2.32.3",
]

[project.scripts]
ingest = "ingestion.cli:main"

[dependency-groups]
dbt = [
    "dbt-core>=1.11.2",
    "dbt-duckdb>=1.10.0",
]
notebooks = [
    "duckdb>=1.1.3",
    "duckdb-engine>=0.15.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "ipython-sql>=0.5.0",
    "jupysql>=0.10.17",
    "jupyter>=1.1.0,<2",
    "marimo>=0.25.2",
    "matplotlib>=3.10.0",
    "pandas>=2.2.3",
]
dev = [
    "pre-commit>=4.5.1",
    "sqlfluff>=3.4.1",
    "sqlfluff-templater-dbt>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.7.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dbt", "notebooks", "dev"]

[tool.uv.build-backend]
module-name = "ingestion"
module-root = ""

[tool.ruff.lint]
extend-select = ["I"]

[tool.vulture]
paths = ["ingestion", "notebooks", "python_template"]
